flutter_native_splash:
  # Light theme - White background for better logo contrast
  color: "#FFFFFF" # White background - ensures logo visibility

  # Dark theme - Dark purple background
  color_dark: "#1F1B2E" # Dark purple variant

  # Use full logo for splash screen (better visibility than icon)
  image: assets/logo/flowdr-logo.png
  image_dark: assets/logo/flowdr-logo.png

  #! ANDROID 12+ configuration:
  android_12:
    # background color
    color: "#FFFFFF" # White for better contrast
    color_dark: "#1F1B2E" # Dark purple

    # Use full logo for Android 12+ splash
    image: assets/logo/flowdr-logo.png
    image_dark: assets/logo/flowdr-logo.png

    # Optional: Add a subtle background circle behind logo
    # icon_background_color: "#F5F3FF" # Light purple circle (optional)

  web: false
